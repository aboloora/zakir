  function expertItem(item, reference) {
    var q = { question: item[0], options: item.slice(1, 5), correct_index: 0, explanation: item[5] };
    if (item[6]) q.source_quote = item[6];
    else if (reference) q.reference = reference;
    return q;
  }
  TOPICS[0].levels.expert = EXPERT.sle.map(function (item) { return expertItem(item); });

  ORIGINAL_TOPICS.forEach(function (topic) {
    var levels = {};
    ['easy', 'medium', 'hard'].forEach(function (key) {
      levels[key] = topic[key].map(function (item) {
        return {
          question: item[0], options: item.slice(1, 5), correct_index: 0,
          explanation: item[5], reference: topic.reference
        };
      });
    });
    levels.expert = (EXPERT[topic.id] || []).map(function (item) { return expertItem(item, topic.reference); });
    TOPICS.push({ id: topic.id, title: topic.title, levels: levels });
  });

  var LEVELS = [
    { key: 'easy', name: 'مبتدئ', color: 'var(--z-correct)', description: 'معلومة واحدة مهمة: الحدود والأرقام والعلاج الأول وأعمار الفحص.' },
    { key: 'medium', name: 'متوسط', color: 'var(--z-amber)', description: 'ربط المعلومات وتفسير الفحوصات والمقارنة بين الحالات والأدوية.' },
    { key: 'hard', name: 'صعب', color: 'var(--z-wrong)', description: 'حالات سريرية بأسلوب البورد فيها تفصيل يغيّر الإجابة.' },
    { key: 'expert', name: 'عالي الصعوبة', color: 'var(--z-expert)', description: 'حالات مركّبة بخيارات متقاربة لا يفرّقها إلا تفصيل حاسم.' }
  ];
  // عدد الأسئلة في كل اختبار، تُختار عشوائيًا من بنك المستوى.
  var QUIZ_LENGTH = 20;
  var STEPS = ['الدخول', 'الموضوع', 'الصعوبة', 'الأسئلة'];
  var USER_KEY = 'zakir.page.user';
  // ضع هنا رابط Google Apps Script (Web app URL) الذي ينتهي بـ /exec
  var SHEET_URL = 'https://script.google.com/macros/s/AKfycbyzbzCzUTJusNu-hb-PWpW3PZrBdFkpjyFe--VG4tuWyYTJMKlsKRQ4k_jBym9QFFqU/exec';
  var app = document.getElementById('zakir-app');
  var state = { user: loadUser(), topic: null, level: null };

  function loadUser() {
    try { return JSON.parse(localStorage.getItem(USER_KEY)); } catch (error) { return null; }
  }
  function saveUser(user) {
    try {
      if (user) localStorage.setItem(USER_KEY, JSON.stringify(user));
      else localStorage.removeItem(USER_KEY);
    } catch (error) { /* The quiz still works for this visit without saved data. */ }
  }
  // الاتصال بـ Google Sheet. أي فشل يعيد null ولا يوقف الاختبار.
  function sheetReady() { return /^https:\/\/script\.google\.com\//.test(SHEET_URL) && !!window.fetch; }
  function readJson(response) { return response.json(); }
  function postToSheet(payload) {
    if (!sheetReady()) return Promise.resolve(null);
    return fetch(SHEET_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(readJson).catch(function () { return null; });
  }
  function getHistory(email) {
    if (!sheetReady()) return Promise.resolve(null);
    return fetch(SHEET_URL + '?action=history&email=' + encodeURIComponent(email))
      .then(readJson).catch(function () { return null; });
  }
  // مواضيع ملفات Drive وأسئلتها، من ورقة "الأسئلة".
  function getFileTopics() {
    if (!sheetReady()) return Promise.resolve(null);
    return fetch(SHEET_URL + '?action=topics').then(readJson).catch(function () { return null; });
  }
  function getTopicQuestions(id) {
    if (!sheetReady()) return Promise.resolve(null);
    return fetch(SHEET_URL + '?action=questions&id=' + encodeURIComponent(id))
      .then(readJson).catch(function () { return null; });
  }
  function bankOf(topic, key) { return (topic.levels && topic.levels[key]) || []; }
  var ORDINALS = ['الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس', 'السابع', 'الثامن', 'التاسع', 'العاشر'];
  function testName(i) { return 'الاختبار ' + (ORDINALS[i] || ('رقم ' + (i + 1))); }
  function formatDate(value) {
    var date = new Date(value);
    if (isNaN(date)) return '';
    try {
      return date.toLocaleString('ar-u-ca-gregory-nu-latn', { year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    } catch (error) { return date.toLocaleString(); }
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function button(className, text, onClick) {
    var node = el('button', className, text);
    node.type = 'button';
    node.addEventListener('click', onClick);
    return node;
  }
  function shuffle(list) {
    var copy = list.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var swap = copy[i]; copy[i] = copy[j]; copy[j] = swap;
    }
    return copy;
  }
  function withShuffledOptions(question) {
    var correct = question.options[question.correct_index];
    var options = shuffle(question.options);
    return Object.assign({}, question, { options: options, correct_index: options.indexOf(correct) });
  }

  // Clears the app, draws its header and returns the area for the current screen.
  function screen(step) {
    app.textContent = '';
    var inner = el('div', 'z-inner');
    app.appendChild(inner);
    if (app.getBoundingClientRect().top < 0) app.scrollIntoView();
    if (step === 1) return inner;

    var head = el('div', 'z-head');
    head.appendChild(el('span', 'z-brand', 'ذاكِر'));
    var steps = el('div', 'z-steps');
    STEPS.forEach(function (label, i) {
      steps.appendChild(el('span', i + 1 === step ? 'is-current' : i + 1 < step ? 'is-done' : '', (i + 1) + '. ' + label));
    });
    head.appendChild(steps);
    head.appendChild(button('z-btn z-ghost', 'خروج', function () {
      state.user = null;
      state.historyRequest = null;
      saveUser(null);
      showLogin();
    }));
    inner.appendChild(head);
    return inner;
  }

  // Page 1
  function showLogin() {
    var root = screen(1);
    var card = el('div', 'z-card z-login');
    card.appendChild(el('h1', 'z-brand', 'ذاكِر'));
    card.appendChild(el('p', 'z-muted', 'سجّل دخولك لبدء الاختبار.'));

    function field(id, labelText, type) {
      var wrap = el('div', 'z-field');
      var label = el('label', '', labelText);
      label.htmlFor = id;
      var input = el('input');
      input.id = id;
      input.type = type;
      var error = el('p', 'z-error');
      error.hidden = true;
      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); submit(); }
      });
      wrap.appendChild(label);
      wrap.appendChild(input);
      wrap.appendChild(error);
      card.appendChild(wrap);
      return { input: input, setError: function (message) {
        error.textContent = message;
        error.hidden = !message;
        input.setAttribute('aria-invalid', message ? 'true' : 'false');
      } };
    }

    var name = field('zakir-name', 'الاسم', 'text');
    name.input.autocomplete = 'name';
    var email = field('zakir-email', 'البريد الإلكتروني', 'email');
    email.input.autocomplete = 'email';
    email.input.dir = 'ltr';

    function submit() {
      var nameValue = name.input.value.trim();
      var emailValue = email.input.value.trim();
      var nameError = nameValue.length >= 2 ? '' : 'اكتب اسمك (حرفان على الأقل).';
      var emailError = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue) ? '' : 'اكتب بريدًا إلكترونيًا صحيحًا.';
      name.setError(nameError);
      email.setError(emailError);
      if (nameError) { name.input.focus(); return; }
      if (emailError) { email.input.focus(); return; }
      state.user = { name: nameValue, email: emailValue };
      saveUser(state.user);
      state.historyRequest = postToSheet({ action: 'login', name: nameValue, email: emailValue, page: location.href });
      showTopics();
    }

    card.appendChild(button('z-btn z-primary z-block', 'دخول', submit));
    card.appendChild(el('p', 'z-hint', 'يُسجَّل الاسم والبريد لدى إدارة الموقع لمتابعة المشاركين.'));
    root.appendChild(card);
  }

  // Page 2
  function showTopics() {
    var root = screen(2);
    var title = el('div', 'z-title');
    title.appendChild(el('h1', '', 'اختر الموضوع'));
    var greeting = el('p', 'z-muted', 'أهلًا ' + state.user.name + '، ماذا تريد أن تراجع اليوم؟');

    root.appendChild(title);
    var historyBox = el('div', 'z-card z-history');
    historyBox.hidden = !sheetReady();

    historyBody.appendChild(el('p', 'z-muted', 'جارٍ تحميل اختباراتك السابقة…'));
    historyBox.appendChild(historyBody);
    if (!state.historyRequest) state.historyRequest = getHistory(state.user.email);
    state.historyRequest.then(function (data) {
      historyBody.textContent = '';

        historyBody.appendChild(el('p', 'z-muted', 'تعذّر تحميل الاختبارات السابقة الآن.'));

      }
      if (data.registered) greeting.textContent = 'أهلًا بعودتك ' + state.user.name + '، أنت مسجّل لدينا سابقًا.';
      var tests = data.tests || [];
      if (!tests.length) {
        historyBody.appendChild(el('p', 'z-muted', data.registered ? 'لم تُكمل أي اختبار بعد.' : 'هذا أول دخول لك. ستظهر نتائج اختباراتك هنا.'));
        return;
      }
      var list = el('div', 'z-history-list');
      tests.forEach(function (test, i) {
        var row = el('div', 'z-history-item');
        var top = el('div', 'z-history-top');
        top.appendChild(el('strong', '', testName(i)));
        top.appendChild(el('span', 'z-history-score', test.score + ' من ' + test.total + ' (' + test.percent + '%)'));
        row.appendChild(top);
        var meta = el('p', 'z-muted z-history-meta', test.topic + ' · ' + test.level + ' · ' + formatDate(test.date));

      historyBody.appendChild(list);

    // مواضيع ملفات Drive: تُحمَّل من الـ Sheet وتظهر قبل المواضيع الثابتة.

  // بطاقة موضوع من ملف PDF في مجلد Drive.
  function fileTopicCard(info) {
    var card = el('div', 'z-card');

  // Page 4
  function showQuiz() {
    var questions = shuffle(bankOf(state.topic, state.level.key)).slice(0, QUIZ_LENGTH).map(withShuffledOptions);
    var index = 0;

    function note(label, text) {
      var box = el('div', 'z-note');

      var body = el('p', '', text);

    }
    function appendSupport(parent, question) {
      parent.appendChild(note('الشرح:', question.explanation));
      if (question.source_quote) parent.appendChild(note('من المقال:', question.source_quote));
      if (question.reference) parent.appendChild(note('للمراجعة:', question.reference));
    }

    function showQuestion() {
      var question = questions[index];
      var root = screen(4);
      root.appendChild(button('z-link', 'تغيير مستوى الصعوبة', showLevels));

      var progress = el('div', 'z-progress');
      progress.appendChild(el('span', '', 'السؤال ' + (index + 1) + ' من ' + questions.length));

      var bar = el('div', 'z-bar');
      var fill = el('div', 'z-fill');
      fill.style.width = ((index + 1) / questions.length * 100) + '%';
      bar.appendChild(fill);
      root.appendChild(bar);

      var card = el('div', 'z-card');
      var stem = el('h1', 'z-stem', question.question);
      stem.dir = 'auto';
      stem.tabIndex = -1;
      card.appendChild(stem);

      var options = el('div', 'z-options');
      var buttons = question.options.map(function (text, optionIndex) {
        var option = button('z-option', undefined, function () { answer(optionIndex); });
        option.dir = 'auto';
        option.appendChild(el('span', '', text));
        options.appendChild(option);
        return option;
      });
      card.appendChild(options);

      var feedback = el('div', 'z-feedback');
      feedback.setAttribute('role', 'status');
      feedback.hidden = true;
      card.appendChild(feedback);
      root.appendChild(card);
      stem.focus({ preventScroll: true });

      function answer(chosen) {
        var isCorrect = chosen === question.correct_index;
        if (isCorrect) score++;
        else missed.push(question);

        buttons.forEach(function (option, optionIndex) {
          option.disabled = true;
          if (optionIndex === question.correct_index) {
            option.classList.add('is-correct');
            option.appendChild(el('span', 'z-mark', '✓ الإجابة الصحيحة'));
          } else if (optionIndex === chosen) {
            option.classList.add('is-wrong');
            option.appendChild(el('span', 'z-mark', '✗ إجابتك'));
          }
        });

        feedback.hidden = false;
        feedback.appendChild(el('strong', isCorrect ? 'z-text-correct' : 'z-text-wrong', isCorrect ? 'إجابة صحيحة' : 'إجابة غير صحيحة'));
        appendSupport(feedback, question);
        var next = button('z-btn z-primary', index + 1 < questions.length ? 'السؤال التالي' : 'عرض النتيجة', function () {
          index++;
          if (index < questions.length) showQuestion();
          else showResults();
        });
        feedback.appendChild(next);
        next.focus({ preventScroll: true });
      }
    }

    function showResults() {
      var root = screen(4);
      var percent = Math.round(score / questions.length * 100);
      var card = el('div', 'z-card z-results');
      card.appendChild(el('p', 'z-score', percent + '%'));
      card.appendChild(el('h1', '', 'إجاباتك الصحيحة: ' + score + ' من ' + questions.length));
      card.appendChild(el('p', 'z-muted',
        percent >= 80 ? 'نتيجة ممتازة. جرّب مستوى أعلى.' :
        percent >= 50 ? 'نتيجة جيدة. راجع الإجابات أدناه ثم أعد المحاولة.' :
        'راجع الموضوع ثم أعد المحاولة.'));
      var actions = el('div', 'z-actions z-center');
      actions.appendChild(button('z-btn z-primary', 'جولة جديدة', showQuiz));
      actions.appendChild(button('z-btn z-secondary', 'موضوع آخر', showTopics));
      card.appendChild(actions);
      root.appendChild(card);

      if (sheetReady()) {
        var mailStatus = el('p', 'z-hint', 'جارٍ إرسال النتيجة إلى بريدك…');
        card.appendChild(mailStatus);
        var request = postToSheet({
          action: 'result', name: state.user.name, email: state.user.email,
          topic: state.topic.title, level: state.level.name,
          score: score, total: questions.length, percent: percent,
          missed: missed.map(function (q) { return { question: q.question, answer: q.options[q.correct_index] }; })
        });
        state.historyRequest = request.then(function (data) {
          return data && data.ok ? data : getHistory(state.user.email);
        });
        request.then(function (data) {
          if (data && data.ok && data.mailed) {
            mailStatus.textContent = 'أُرسلت النتيجة إلى ' + state.user.email + ' (' + testName((data.tests || []).length - 1) + ').';
          } else {
            mailStatus.textContent = 'تعذّر إرسال النتيجة إلى البريد هذه المرة.';
          }
        });
      }

      if (missed.length) {
        var review = el('div', 'z-review');
        review.appendChild(el('h2', '', 'الأسئلة التي تحتاج إلى مراجعة'));
        missed.forEach(function (question) {
          var item = el('div', 'z-card');
          var stem = el('p', 'z-review-stem', question.question);
          stem.dir = 'auto';
          var correct = el('p', '', question.options[question.correct_index]);
          correct.dir = 'auto';
          item.appendChild(stem);
          item.appendChild(el('p', 'z-text-correct z-label', '✓ الإجابة الصحيحة'));
          item.appendChild(correct);
          appendSupport(item, question);
          review.appendChild(item);
        });
        root.appendChild(review);
      }
    }

    showQuestion();
  }

  if (state.user) showTopics();
  else showLogin();
})();
</script>
